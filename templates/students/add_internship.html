{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Add Internship Details</h2>
        <a href="{{ url_for('view_student', id=student_id) }}" class="btn btn-secondary">Back to Student</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="company">Company Name</label>
                            <input type="text" class="form-control" id="company" name="company" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="duration">Duration</label>
                            <input type="text" class="form-control" id="duration" name="duration" placeholder="e.g., 3 months" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="domain">Domain</label>
                            <input type="text" class="form-control" id="domain" name="domain" placeholder="e.g., Web Development" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="status">Status</label>
                            <select class="form-control" id="status" name="status" required>
                                <option value="ongoing">Ongoing</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <div class="form-group mb-3">
                            <label for="completion_certificate">Completion Certificate (PDF)</label>
                            <input type="file" class="form-control" id="completion_certificate" name="completion_certificate" accept=".pdf">
                        </div>
                    </div>
                </div>
                <div class="text-end mt-3">
                    <button type="submit" class="btn btn-primary">Save Internship Details</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
